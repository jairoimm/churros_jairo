<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buen Apetito 🍓</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fff5f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #ff6b95 0%, #ff8da1 100%) !important;
            box-shadow: 0 4px 12px rgba(255, 107, 149, 0.2);
        }
        .hero-section {
            background: linear-gradient(135deg, #ffe6ed 0%, #ffc2d4 100%);
            border: 1px solid #ffb3c9;
            border-radius: 1.5rem;
        }
        .btn-pink {
            background-color: #ff4d88;
            border-color: #ff4d88;
            color: white;
            font-weight: 600;
            border-radius: 50rem;
            padding: 0.6rem 1.5rem;
            transition: all 0.2s ease;
        }
        .btn-pink:hover {
            background-color: #e03b73;
            border-color: #e03b73;
            color: white;
            transform: translateY(-1px);
        }
        .btn-outline-pink {
            color: #ff4d88;
            border-color: #ff4d88;
            font-weight: 600;
            border-radius: 50rem;
        }
        .btn-outline-pink:hover {
            background-color: #ff4d88;
            color: white;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(255, 107, 149, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 1rem 1.5rem rgba(255, 107, 149, 0.15);
        }
        .card-img-top {
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }
        input, select, textarea {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #495057;
            background-color: #fff;
            background-clip: padding-box;
            border: 1px solid #ced4da;
            border-radius: 0.5rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            margin-bottom: 1rem;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #ff6b95;
            outline: 0;
            box-shadow: 0 0 0 0.2rem rgba(255, 107, 149, 0.25);
        }
        label {
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: #555;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-white text-decoration-none" href="{% url 'product_list' %}">
                🍓 Buen Apetito 🍩
            </a>
            <div class="ms-auto">
                <a class="btn btn-light text-danger fw-bold shadow-sm rounded-pill px-4" href="{% url 'cart_detail' %}">
                    🛒 Mi Pedido
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center py-4 text-muted small">
        <p>© 2026 Buen Apetito - Dulzura y tradición en cada mordisco ✨</p>
    </footer>

</body>

</html>
