<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Buen Apetito</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                👨‍🍳 Buen <span>Apetito</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="catalog.html" class="active">Menú</a>
                <a href="cart.html" class="cart-icon-btn">
                    🛒
                    <span class="cart-badge" style="display: none;">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main>
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2.2rem; font-weight: 900; margin-bottom: 0.5rem; color: var(--text-dark);">Nuestro Menú 🍩</h1>
            <p style="color: var(--text-muted); font-size: 1.05rem;">Churros artesanales con el mejor sabor 💖</p>
        </div>

        <div class="category-pills" id="category-pills">
            <button class="category-pill active" data-filter="all">Todos</button>
            <button class="category-pill" data-filter="tradicionales">Tradicionales</button>
            <button class="category-pill" data-filter="rellenos">Rellenos</button>
            <button class="category-pill" data-filter="jumbo">Jumbo</button>
        </div>

        <div id="catalog-grid" class="product-grid">
            <!-- Loaded dynamically -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Buen Apetito. Todos los derechos reservados. 🍩</p>
    </footer>

    <script type="module">
        import { getProducts, formatPrice } from './assets/js/products.js';
        import './assets/js/app.js';

        async function initCatalog() {
            const products = await getProducts();
            const container = document.getElementById('catalog-grid');

            function renderProducts(filter) {
                let filtered = products;
                if (filter === 'tradicionales') {
                    filtered = products.filter(p => p.name.toLowerCase().includes('tradicional') || p.name.toLowerCase().includes('familiar'));
                } else if (filter === 'rellenos') {
                    filtered = products.filter(p => p.name.toLowerCase().includes('relleno') || p.name.toLowerCase().includes('mix'));
                } else if (filter === 'jumbo') {
                    filtered = products.filter(p => p.name.toLowerCase().includes('jumbo') || p.name.toLowerCase().includes('pareja'));
                }

                container.innerHTML = filtered.map(p => `
                    <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'" style="cursor: pointer;">
                        ${p.badge_text ? `<span class="product-badge">${p.badge_text}</span>` : ''}
                        <div class="product-img-wrapper">
                            <img src="${p.image}" alt="${p.name}">
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${p.name}</h3>
                            <p class="product-desc">${p.description}</p>
                            <div class="product-footer">
                                <div>
                                    <span class="product-price">${formatPrice(p.price)}</span>
                                    ${p.old_price ? `<span class="old-price">${formatPrice(p.old_price)}</span>` : ''}
                                </div>
                                <span class="btn" style="padding: 0.4rem 1rem; font-size: 0.85rem;">Agregar +</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            renderProducts('all');

            document.querySelectorAll('.category-pill').forEach(pill => {
                pill.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    renderProducts(pill.dataset.filter);
                });
            });
        }

        initCatalog();
    </script>
</body>
</html>
